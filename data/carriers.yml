# Carrier facts that have NO machine-readable source in the repos themselves.
#
# Everything the repos already know — display name, domain, version, icon,
# release date, repo URL — is read from the GitHub API by scripts/generate.py.
# Do not repeat any of that here; it will be ignored and it will go stale.
#
# `scripts/generate.py` FAILS THE BUILD if the org has a carrier repo that is
# missing from this file, or if this file lists a repo that no longer exists.
# That hard failure is the whole point: it is what stops the site from
# quietly falling behind the suite when a new carrier lands.
#
# Fields per repo:
#   region     free-text coverage shown in the table ("Netherlands", "Nordics")
#   countries  ISO 3166-1 alpha-2 codes, used for the flag column. ALWAYS quote
#              them — YAML 1.1 reads a bare NO (Norway) as the boolean false,
#              and the same trap waits for ON, OFF, Y and N.
#   auth       "account" (user logs in) or "trackingnr" (no account needed)
#   input      what the user types when auth is "trackingnr". Phrase it to sit
#              mid-sentence ("tracking number", not "Tracking number") — the
#              site capitalises it where it needs a capital.
#   blurb      one sentence, sentence case, no trailing period
#   directions "incoming" or "incoming+outgoing"

ha-budbee:
  region: Nordics and Benelux
  countries: ["SE", "NL", "BE", "DK", "FI", "NO"]
  auth: trackingnr
  input: tracking or order number
  directions: incoming+outgoing
  blurb: Budbee home deliveries and Budbee Box lockers, without the e-mail address their tracking page asks for

