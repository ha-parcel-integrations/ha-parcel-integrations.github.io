# Carrier facts that have NO machine-readable source in the repos themselves.
#
# Everything the repos already know — display name, domain, version, icon,
# release date, repo URL — is read from the GitHub API by scripts/generate.py.
# Do not repeat any of that here; it will be ignored and it will go stale.
#
# `scripts/generate.py` FAILS THE BUILD if the org has a carrier repo that is
# missing from this file, or if this file lists a repo that no longer exists.
# That hard failure is the whole point: it is what stops the site from
# quietly falling behind the suite when a new carrier lands.
#
# Fields per repo:
#   region     free-text coverage shown in the table ("Netherlands", "Nordics")
#   countries  ISO 3166-1 alpha-2 codes, used for the flag column. ALWAYS quote
#              them — YAML 1.1 reads a bare NO (Norway) as the boolean false,
#              and the same trap waits for ON, OFF, Y and N.
#   auth       "account" (user logs in), "trackingnr" (no account needed) or
#              "apikey" (the user brings their own official API credentials).
#              A carrier whose backends authenticate differently writes a
#              mapping instead, keyed by the SAME backend labels its own
#              const.py declares in CAPABILITIES_BY_VARIANT (a label that is
#              not in there fails the build, so the two pages can never name
#              the same backend differently):
#                  auth:
#                    Informed Delivery:
#                      kind: account
#                    API Tracking:
#                      kind: apikey
#                      input: tracking code
#              Only reach for that when the auth kinds genuinely differ —
#              one backend needing an extra field is `input` prose, not a
#              second entry.
#   input      what the user types when auth is "trackingnr". Phrase it to sit
#              mid-sentence ("tracking code", not "Tracking code") — the
#              site capitalises it where it needs a capital. With the mapping
#              form of `auth` it goes inside each backend, never next to it.
#   blurb      one sentence, sentence case, no trailing period
#   directions "incoming" or "incoming+outgoing"
#   aliases    optional list of {name, blurb, region?, countries?} — an extra
#              site/profile listing for the same repo under a second brand
#              name (own row, own blurb, same repo link/version/icon/
#              capabilities as the primary entry). Use when one repo answers
#              to two names a user would search separately (e.g. a carrier's
#              own locker/pickup brand); it is not a second integration.
#              region/countries default to the primary entry's — set them on
#              the alias only when the two brands don't cover the same
#              territory (e.g. one brand name per country within the repo's
#              overall coverage).
#   icon       optional override of the repo's own brand/icon.png, for this
#              site's primary row only — a PNG in data/icons/, 256x256 like
#              every other brand icon (tools/icon_audit.py checks it). Use it
#              only when one repo lists here under two brand names and the
#              primary row should carry one brand's mark while an alias row
#              carries the other (ha-posten-bring). HA and HACS keep reading
#              the repo's own icon; this is the listing only.
#   name       optional override of the manifest's display name, for this
#              site's primary row only. The manifest name stays the source of
#              truth everywhere else (HA UI, HACS, README) — use this only
#              when the manifest name carries scope an alias entry already
#              covers (e.g. "X, including Y" once Y has its own alias row)
#              and the shorter form reads better as a site listing.
#   experimental  optional `true` for a trial integration that may still be
#              renamed, restructured or withdrawn — not just unconfirmed
#              statuses, which any pre-1.0 release already flags as Beta. It
#              swaps the Beta badge for an Experimental one.

