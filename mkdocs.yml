site_name: Home Assistant parcel integrations
site_description: >-
  Package and parcel tracking in Home Assistant, across every carrier and
  country — PostNL, DHL, DPD, GLS, PostNord, Hermes and more, all speaking one
  canonical parcel contract.
site_url: https://ha-parcel-integrations.github.io/
repo_url: https://github.com/ha-parcel-integrations
repo_name: ha-parcel-integrations
edit_uri: ""
copyright: >-
  Independent and MIT-licensed —
  <a href="https://ha-parcel-integrations.github.io/disclaimer/">disclaimer</a> ·
  <a href="https://ha-parcel-integrations.github.io/sponsor/">support the project</a>

theme:
  name: material
  custom_dir: docs/overrides
  language: en
  # Vector in the header, where it renders at ~18px and the raster original's
  # antennae turned to grey mush. The favicon stays a PNG: an SVG favicon is
  # fine in current browsers but a PNG is fine in all of them.
  logo: assets/logo.svg
  favicon: assets/logo.png
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    # Tabs carry the four top-level sections, the sidebar the pages inside
    # them. Sticky because the landing page hides the sidebar — without it
    # there is no navigation at all once you scroll past the hero.
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
    - toc.follow

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/carriers-filter.js

# Appends a content hash to the two files above. Without it, a deploy's new
# HTML can be served alongside the stylesheet a returning visitor cached ten
# minutes earlier — see hooks/cachebust.py.
hooks:
  - hooks/cachebust.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ha-parcel-integrations
      name: The integrations on GitHub
    - icon: fontawesome/solid/comments
      link: https://community.home-assistant.io/t/packages-postnl-dhl-nl-dpd-and-gls-parcel-integration/112433/
      name: Home Assistant community thread
    - icon: simple/githubsponsors
      link: https://github.com/sponsors/peternijssen
      name: Sponsor the project on GitHub
    - icon: simple/buymeacoffee
      link: https://www.buymeacoffee.com/peternijssen
      name: Buy me a coffee

nav:
  - Home: index.md
  - Start here:
      - Getting started: install.md
      - Carriers: carriers.md
      - Troubleshooting: troubleshooting.md
  - Build something:
      - Automation cookbook: automations.md
      - Dashboard cards: dashboards.md
      - Track from e-mail: email.md
  - Reference:
      - Parcel contract: contract.md

# Reachable from the landing page and the footer, but a donate link or a
# disclaimer does not belong in the nav between the reference docs.
not_in_nav: |
  sponsor.md
  disclaimer.md
